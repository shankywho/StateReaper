version: "3.8"

services:
  statereaper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: statereaper-finops
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist the append-only audit log across restarts
      - ./audit-logs:/app/audit-logs
    environment:
      - NODE_ENV=production
    networks:
      - statereaper-net

networks:
  statereaper-net:
    driver: bridge

volumes:
  audit-logs:

